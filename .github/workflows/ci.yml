name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphiti_pg_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SQL Server 2025 for the SQL Server driver tests (the tests create their database). A throwaway CI password.
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Graphiti_dev_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Graphiti_dev_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      GRAPHITI_TEST_POSTGRES: "Host=localhost;Username=postgres;Password=postgres;Database=graphiti_pg_tests"
      GRAPHITI_TEST_SQLSERVER: "Server=localhost,1433;Database=graphiti_sqlserver_tests;User Id=sa;Password=Graphiti_dev_Passw0rd;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore GraphitiNet.slnx
      - run: dotnet build GraphitiNet.slnx --no-restore --configuration Release
      - run: dotnet test GraphitiNet.slnx --no-build --configuration Release

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet pack GraphitiNet.slnx --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
